name: CI

# Runs once per change: pull requests test the result of merging into the
# target branch; pushes to main verify the merge itself (and build the
# container image). Branches without an open PR don't run CI. Tag pushes are
# handled by release.yml, which stamps the version and pushes the image.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Integration test (throwaway OIDC provider)
        run: make test-integration

      - name: Build
        run: make build

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Derive snapshot version
        id: version
        run: echo "version=$(cat VERSION)-snapshot.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
