name: CI

# Runs once per change: pull requests test the result of merging into the
# target branch; pushes to main verify the merge itself (and build the
# container image). Branches without an open PR don't run CI. Tag pushes are
# handled by release.yml, which stamps the version and pushes the image.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Integration test (throwaway OIDC provider)
        run: make test-integration

      - name: Build
        run: make build

  e2e:
    name: PXE boot in QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install QEMU, OVMF and dnsmasq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf dnsmasq iproute2 libcap2-bin
          sudo systemctl disable --now dnsmasq || true

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Cache Alpine netboot files
        uses: actions/cache@v4
        with:
          path: ~/.cache/bootimus-e2e
          key: bootimus-e2e-alpine-${{ hashFiles('e2e/alpine_test.go') }}

      - name: Build the binary under test
        run: make e2e-binary

      - name: Allow the binary to bind the TFTP and DHCP ports
        run: sudo setcap cap_net_bind_service=+ep .e2e/bootimus

      - name: Boot virtual machines against it
        env:
          BOOTIMUS_E2E_BINARY: ${{ github.workspace }}/.e2e/bootimus
          BOOTIMUS_E2E_REQUIRE_TFTP: "1"
          BOOTIMUS_E2E_PROXYDHCP: "1"
        run: make test-e2e

      - name: Upload boot logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run-logs
          path: .e2e/run
          if-no-files-found: ignore

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Derive snapshot version
        id: version
        run: echo "version=$(cat VERSION)-snapshot.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
